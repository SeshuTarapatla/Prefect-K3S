[project]
name = "prefect-k3s"
version = "0.1.0"
description = "A helper project to build my custom prefect image and setup deployed in local Kubernetes."
readme = "README.md"
authors = [
    { name = "SeshuTarapatla", email = "seshu.tarapatla@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "my-modules",
    "prefect>=3.6.21",
    "pydantic>=2.12.5",
    "sqlalchemy>=2.0.48",
    "typer>=0.24.1",
]

[project.scripts]
prefect-k3s = "prefect_k3s:prefect_k3s"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
# Pinned to match Insta-Automate's and wsl-bridge's own pins (D65,
# Insta-Automate-Control-Center DECISIONS.md D71) — uv's resolver treats an
# unpinned git URL and a @rev-pinned one for the same package as genuinely
# conflicting sources, so every repo in this dependency graph that
# references my-modules has to agree on the same pin.
my-modules = { git = "https://github.com/SeshuTarapatla/my-modules.git", rev = "94b308a" }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]
